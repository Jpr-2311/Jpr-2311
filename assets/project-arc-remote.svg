<svg xmlns="http://www.w3.org/2000/svg" width="880" height="120" viewBox="0 0 880 120">

  <defs>
    <pattern id="scanp2" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.38"/>
    </pattern>
    <pattern id="gridp2" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#39FF88" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="vigp2" cx="50%" cy="50%" r="75%">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <linearGradient id="sweepp2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39FF88" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39FF88" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#39FF88" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowp2" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglowp2" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clipp2"><rect width="880" height="120" rx="10"/></clipPath>
  </defs>
