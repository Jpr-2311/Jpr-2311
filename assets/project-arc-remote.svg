    <text x="170" y="76" fill="#C9F7DD" font-family="ui-monospace, 'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="400" text-anchor="start" xml:space="preserve">&gt; AI desktop automation · phone → local agent</text>
    <text x="170" y="104" fill="#22D3EE" fill-opacity="0.85" font-family="ui-monospace, 'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" text-anchor="start" xml:space="preserve">python · fastapi · websocket · sqlite · gemini · playwright</text>
    <text x="852" y="104" fill="#3E6B55" font-family="ui-monospace, 'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" text-anchor="end" xml:space="preserve">open ↗</text>
    <rect width="880" height="120" fill="url(#scanp2)"/>
