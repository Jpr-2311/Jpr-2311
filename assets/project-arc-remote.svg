    <text x="170" y="42" fill="#39FF88" font-family="ui-monospace, 'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="25" font-weight="700" text-anchor="start" filter="url(#glowp2)" xml:space="preserve">arc-remote/</text>
    <rect x="764" y="22" width="88" height="26" rx="3" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.7"/>
