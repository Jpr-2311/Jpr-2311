      <stop offset="1" stop-color="#39FF88" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowp4" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
