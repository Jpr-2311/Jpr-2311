<svg xmlns="http://www.w3.org/2000/svg" width="880" height="116" viewBox="0 0 880 116">

  <defs>
    <pattern id="scanph" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.38"/>
    </pattern>
    <pattern id="gridph" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#39FF88" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="vigph" cx="50%" cy="50%" r="75%">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.65"/>
    </radialGradient>
    <linearGradient id="sweepph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39FF88" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39FF88" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#39FF88" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowph" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglowph" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clipph"><rect width="880" height="116" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#clipph)">
    <rect width="880" height="116" fill="#040B08"/>
    <rect width="880" height="116" fill="url(#gridph)"/>
    
    
    <text x="34" y="72" fill="#39FF88" font-family="ui-monospace, 'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" font-weight="400" text-anchor="start" filter="url(#glowph)" xml:space="preserve">$ ls -la ~/projects</text>
    <text x="34" y="100" fill="#3E6B55" font-family="ui-monospace, 'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" text-anchor="start" letter-spacing="2" xml:space="preserve">PERMS</text>
    <text x="170" y="100" fill="#3E6B55" font-family="ui-monospace, 'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" text-anchor="start" letter-spacing="2" xml:space="preserve">NAME</text>
    <text x="846" y="100" fill="#3E6B55" font-family="ui-monospace, 'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" text-anchor="end" letter-spacing="2" xml:space="preserve">TAG</text>
    
    <rect width="880" height="36" fill="#07130D"/>
    <rect y="35" width="880" height="1" fill="#39FF88" fill-opacity="0.25"/>
    <rect x="18" y="14" width="9" height="9" fill="#39FF88" fill-opacity="0.85"/>
    <rect x="33" y="14" width="9" height="9" fill="#22D3EE" fill-opacity="0.6"/>
    <rect x="48" y="14" width="9" height="9" fill="#A78BFA" fill-opacity="0.6"/>
    <text x="72" y="23" fill="#7FA391" font-family="ui-monospace, 'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" text-anchor="start" letter-spacing="1" xml:space="preserve">~/projects</text>
    <text x="862" y="23" fill="#3E6B55" font-family="ui-monospace, 'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" text-anchor="end" letter-spacing="1" xml:space="preserve">[ 5 entries ]</text>
    <rect width="880" height="116" fill="url(#scanph)"/>
    <rect width="880" height="116" fill="url(#vigph)"/>
  </g>
  <rect x="0.75" y="0.75" width="878.5" height="114.5" rx="9.5" fill="none" stroke="#39FF88" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>
