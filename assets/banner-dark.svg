<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="t d">
  <title id="t">Jithin P R</title>
  <desc id="d">Full-Stack Developer · Backend Engineering · AI-Powered Applications</desc>
  <defs>
    <clipPath id="card"><rect width="1280" height="300" rx="16"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="78%" cy="40%" r="70%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1280" height="300" fill="url(#fade)"/></mask>
    <radialGradient id="violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="300" fill="#0A0A0B"/>
    <rect width="1280" height="300" fill="url(#grid)" mask="url(#gridMask)"/>
    <ellipse cx="1010" cy="40" rx="420" ry="260" fill="url(#violet)"/>
    <ellipse cx="1180" cy="290" rx="320" ry="200" fill="url(#blue)"/>

    <!-- abstract system graph -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.25">
      <path d="M860 96 L968 150 L1092 112 L1188 176"/>
      <path d="M968 150 L1010 232 L1128 228 L1188 176"/>
      <path d="M860 96 L902 206 L1010 232"/>
      <path d="M1092 112 L1128 228"/>
    </g>
    <g fill="#0A0A0B" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.25">
      <circle cx="860" cy="96" r="5"/>
      <circle cx="902" cy="206" r="4"/>
      <circle cx="1092" cy="112" r="5"/>
      <circle cx="1010" cy="232" r="4"/>
      <circle cx="1188" cy="176" r="5"/>
    </g>
    <circle cx="968" cy="150" r="7" fill="#7C5CFF"/>
    <circle cx="968" cy="150" r="16" fill="#7C5CFF" fill-opacity="0.16"/>
    <circle cx="1128" cy="228" r="6" fill="#3B82F6"/>
    <circle cx="1128" cy="228" r="14" fill="#3B82F6" fill-opacity="0.16"/>

    <!-- text -->
    <rect x="72" y="92" width="28" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="112" y="98" fill="#8B8B94" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing="2.5">JPR-2311</text>
    <text x="68" y="176" fill="#F5F5F7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="600" letter-spacing="-2">Jithin P R</text>
    <text x="72" y="222" fill="#A1A1AA" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" letter-spacing="-0.2">Full-stack products · Backend systems · AI-powered tools</text>

    <rect x="0.5" y="0.5" width="1279" height="299" rx="15.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
  </g>
