<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-labelledby="title desc">
  <title id="title">Jithin PR</title>
  <desc id="desc">Full Stack Developer | Software Engineer | AI Enthusiast</desc>
  <style>
    .rise   { animation: rise 900ms cubic-bezier(.2,.7,.2,1) both; }
    .wipe   { transform-box: fill-box; transform-origin: 0 50%; animation: wipe 1300ms cubic-bezier(.65,0,.35,1) 150ms both; }
    .sheen  { animation: sheen 1600ms cubic-bezier(.4,0,.2,1) 1500ms both; }
    .line   { transform-box: fill-box; transform-origin: 0 50%; animation: grow 700ms cubic-bezier(.2,.7,.2,1) 1150ms both; }
    .tag    { animation: rise 800ms cubic-bezier(.2,.7,.2,1) 900ms both; }
    .hello  { animation: fade 700ms ease-out both; }
    @keyframes rise  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes wipe  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes grow  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes sheen { from { transform: translateX(0); } to { transform: translateX(1000px); } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .wipe, .sheen, .line, .tag, .hello { animation: none; }
    }
  </style>
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 40) scale(520 260)">
      <stop offset="0" stop-color="#7176FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7176FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7176FF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <!-- soft-edged reveal: the wipe reads as letters appearing one after another -->
    <linearGradient id="softEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.93" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="880" height="270">
      <rect class="wipe" x="40" y="40" width="520" height="110" fill="url(#softEdge)"/>
    </mask>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="sheenMask" maskUnits="userSpaceOnUse" x="0" y="0" width="880" height="270">
      <rect class="sheen" x="-260" y="40" width="200" height="110" fill="url(#band)"/>
    </mask>
  </defs>

  <rect width="880" height="270" rx="20" fill="#0B0B10"/>
  <rect width="880" height="270" rx="20" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="878.5" height="268.5" rx="19.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text class="hello" x="56" y="70" fill="#8E8E99" font-size="18" letter-spacing="0.4">Hi, I'm</text>

    <g class="rise">
      <g mask="url(#reveal)">
        <text x="52" y="138" fill="#F4F4F6" font-size="76" font-weight="700" letter-spacing="-2.2">Jithin PR</text>
      </g>
      <g mask="url(#sheenMask)">
        <text x="52" y="138" fill="#9EA1FF" font-size="76" font-weight="700" letter-spacing="-2.2">Jithin PR</text>
      </g>
    </g>

    <rect class="line" x="56" y="162" width="56" height="3" rx="1.5" fill="#7176FF"/>

    <text class="tag" x="56" y="212" fill="#B4B4BE" font-size="26" letter-spacing="-0.1">Full Stack Developer<tspan fill="#7176FF" dx="12">|</tspan><tspan dx="12">Software Engineer</tspan><tspan fill="#7176FF" dx="12">|</tspan><tspan dx="12">AI Enthusiast</tspan></text>
  </g>
</svg>
